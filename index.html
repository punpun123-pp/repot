<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>校园食堂点评推荐</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#e64a19',
            secondary: '#ffb74d'
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .card-shadow { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    }
  </style>
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="max-w-5xl mx-auto px-4 py-8">
    <!-- Header -->
    <header class="mb-8">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-[clamp(1.7rem,4vw,2.4rem)] font-bold text-primary flex items-center gap-2">
            <i class="fa fa-cutlery"></i>
            校园食探
          </h1>
          <p class="text-slate-500 mt-1">帮你找到好吃窗口，避开食堂踩雷菜品</p>
        </div>
        <div class="hidden md:flex gap-2">
          <button onclick="showAddDishModal()" class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg transition">
            <i class="fa fa-plus mr-1"></i>提交点评
          </button>
        </div>
      </div>

      <!-- Search & Filter -->
      <div class="mt-6 bg-white rounded-xl p-4 card-shadow grid md:grid-cols-4 gap-3">
        <input id="searchInput" placeholder="搜索菜品 / 窗口名称" class="border rounded-lg px-3 py-2 focus:outline-primary focus:ring-1 focus:ring-primary" oninput="render()">
        <select id="canteenFilter" class="border rounded-lg px-3 py-2" onchange="render()">
          <option value="">全部食堂</option>
        </select>
        <select id="sortFilter" class="border rounded-lg px-3 py-2" onchange="render()">
          <option value="hot">按热度推荐</option>
          <option value="good">好评优先</option>
          <option value="bad">踩雷优先</option>
        </select>
        <button onclick="showAddDishModal()" class="md:hidden bg-primary text-white py-2 rounded-lg">提交点评</button>
      </div>
    </header>

    <!-- Stats Overview -->
    <section class="grid grid-cols-3 gap-4 mb-8">
      <div class="bg-white rounded-xl p-4 card-shadow text-center">
        <div class="text-2xl font-bold text-primary" id="statDish">0</div>
        <div class="text-slate-500 text-sm">已收录菜品</div>
      </div>
      <div class="bg-white rounded-xl p-4 card-shadow text-center">
        <div class="text-2xl font-bold text-green-600" id="statGood">0</div>
        <div class="text-slate-500 text-sm">好评菜品</div>
      </div>
      <div class="bg-white rounded-xl p-4 card-shadow text-center">
        <div class="text-2xl font-bold text-red-500" id="statBad">0</div>
        <div class="text-slate-500 text-sm">避雷标记</div>
      </div>
    </section>

    <!-- Dish List -->
    <section id="dishList" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
    </section>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4">
      <div class="bg-white w-full max-w-lg rounded-xl p-6 card-shadow">
        <h2 class="text-xl font-semibold mb-4">新增菜品点评</h2>
        <div class="space-y-3">
          <label class="block">
            <span class="text-slate-600 text-sm">食堂</span>
            <input id="mCanteen" class="w-full border rounded-lg px-3 py-2 mt-1" placeholder="如一食堂 / 二食堂">
          </label>
          <label class="block">
            <span class="text-slate-600 text-sm">窗口名称</span>
            <input id="mWindow" class="w-full border rounded-lg px-3 py-2 mt-1" placeholder="例如：三楼自选菜">
          </label>
          <label class="block">
            <span class="text-slate-600 text-sm">菜品名称</span>
            <input id="mName" class="w-full border rounded-lg px-3 py-2 mt-1" placeholder="番茄炒蛋">
          </label>
          <label class="block">
            <span class="text-slate-600 text-sm">价格</span>
            <input id="mPrice" type="number" step="0.1" class="w-full border rounded-lg px-3 py-2 mt-1" placeholder="12.0">
          </label>
          <label class="block">
            <span class="text-slate-600 text-sm">评价</span>
            <textarea id="mComment" rows="3" class="w-full border rounded-lg px-3 py-2 mt-1" placeholder="口感、分量、是否踩雷"></textarea>
          </label>
          <div class="flex gap-4">
            <label class="flex items-center gap-1">
              <input type="radio" name="rating" value="good" checked> 推荐
            </label>
            <label class="flex items-center gap-1">
              <input type="radio" name="rating" value="normal"> 一般
            </label>
            <label class="flex items-center gap-1">
              <input type="radio" name="rating" value="bad"> 避雷
            </label>
          </div>
        </div>
        <div class="flex justify-end gap-3 mt-6">
          <button onclick="hideModal()" class="px-4 py-2 border rounded-lg">取消</button>
          <button onclick="submitDish()" class="px-4 py-2 bg-primary text-white rounded-lg">提交</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const defaultData = [
      {
        id: 1,
        canteen: "一食堂",
        window: "一楼黄焖鸡",
        name: "黄焖鸡米饭",
        price: 13,
        comment: "鸡肉量大，汤汁拌饭很香，推荐微辣",
        tag: "good",
        like: 42,
        dislike: 3
      },
      {
        id: 2,
        canteen: "二食堂",
        window: "二楼面食窗口",
        name: "番茄牛肉面",
        price: 11,
        comment: "面容易坨，牛肉很少，谨慎点",
        tag: "bad",
        like: 8,
        dislike: 31
      },
      {
        id: 3,
        canteen: "一食堂",
        window: "三楼自选菜",
        name: "糖醋里脊",
        price: 8,
        comment: "酸甜刚好，分量稳定，经常回购",
        tag: "good",
        like: 29,
        dislike: 2
      }
    ]

    function loadData() {
      const raw = localStorage.getItem("canteenReviewData")
      if (!raw) return defaultData
      try {
        return JSON.parse(raw)
      } catch {
        return defaultData
      }
    }
    function saveData(arr) {
      localStorage.setItem("canteenReviewData", JSON.stringify(arr))
    }

    let data = loadData()

    function refreshCanteenOptions() {
      const sel = document.getElementById("canteenFilter")
      const canteens = [...new Set(data.map(x => x.canteen))]
      sel.innerHTML = `<option value="">全部食堂</option>`
      canteens.forEach(c => {
        const opt = document.createElement("option")
        opt.value = c
        opt.innerText = c
        sel.appendChild(opt)
      })
    }

    function render() {
      refreshCanteenOptions()
      const search = document.getElementById("searchInput").value.trim().toLowerCase()
      const cFilter = document.getElementById("canteenFilter").value
      const sortType = document.getElementById("sortFilter").value

      let list = data.filter(item => {
        const matchSearch = item.name.toLowerCase().includes(search) || item.window.toLowerCase().includes(search)
        const matchCanteen = !cFilter || item.canteen === cFilter
        return matchSearch && matchCanteen
      })

      if (sortType === "hot") {
        list.sort((a, b) => (b.like + b.dislike) - (a.like + a.dislike))
      } else if (sortType === "good") {
        list.sort((a, b) => b.like - a.like)
      } else if (sortType === "bad") {
        list.sort((a, b) => b.dislike - a.dislike)
      }

      const container = document.getElementById("dishList")
      container.innerHTML = ""
      list.forEach(dish => {
        const card = document.createElement("div")
        const tagColor = dish.tag === "good" ? "bg-green-100 text-green-700" : dish.tag === "bad" ? "bg-red-100 text-red-700" : "bg-slate-100 text-slate-600"
        const tagText = dish.tag === "good" ? "✅推荐" : dish.tag === "bad" ? "⚠避雷" : "😐一般"
        card.className = "bg-white rounded-xl p-5 card-shadow"
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <span class="${tagColor} px-2 py-1 rounded text-xs font-medium">${tagText}</span>
            <span class="text-primary font-semibold">¥${dish.price}</span>
          </div>
          <h3 class="text-lg font-semibold mt-2">${escapeHtml(dish.name)}</h3>
          <p class="text-slate-500 text-sm">${escapeHtml(dish.canteen)} · ${escapeHtml(dish.window)}</p>
          <p class="mt-3 text-slate-600 text-sm">${escapeHtml(dish.comment)}</p>
          <div class="flex gap-4 mt-4">
            <button onclick="likeDish(${dish.id})" class="text-green-600 hover:text-green-700"><i class="fa fa-thumbs-up"></i> ${dish.like}</button>
            <button onclick="dislikeDish(${dish.id})" class="text-red-500 hover:text-red-600"><i class="fa fa-thumbs-down"></i> ${dish.dislike}</button>
          </div>
        `
        container.appendChild(card)
      })

      const total = data.length
      const good = data.filter(x => x.tag === "good").length
      const bad = data.filter(x => x.tag === "bad").length
      document.getElementById("statDish").innerText = total
      document.getElementById("statGood").innerText = good
      document.getElementById("statBad").innerText = bad
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;")
    }

    function showAddDishModal() {
      document.getElementById("modal").classList.remove("hidden")
      document.getElementById("modal").classList.add("flex")
    }
    function hideModal() {
      document.getElementById("modal").classList.add("hidden")
      document.getElementById("modal").classList.remove("flex")
    }

    function submitDish() {
      const canteen = document.getElementById("mCanteen").value.trim()
      const windowName = document.getElementById("mWindow").value.trim()
      const name = document.getElementById("mName").value.trim()
      const price = parseFloat(document.getElementById("mPrice").value)
      const comment = document.getElementById("mComment").value.trim()
      const rating = document.querySelector('input[name="rating"]:checked').value
      if (!canteen || !windowName || !name) return alert("食堂、窗口、菜品名称不能为空")

      const newId = Date.now()
      data.push({
        id: newId,
        canteen,
        window: windowName,
        name,
        price: isNaN(price) ? 0 : price,
        comment,
        tag: rating,
        like: 0,
        dislike: 0
      })
      saveData(data)
      hideModal()
      clearModalInputs()
      render()
    }

    function clearModalInputs() {
      document.getElementById("mCanteen").value = ""
      document.getElementById("mWindow").value = ""
      document.getElementById("mName").value = ""
      document.getElementById("mPrice").value = ""
      document.getElementById("mComment").value = ""
      document.querySelector('input[name="rating"][value="good"]').checked = true
    }

    function likeDish(id) {
      const item = data.find(x => x.id === id)
      if (item) {
        item.like += 1
        saveData(data)
        render()
      }
    }
    function dislikeDish(id) {
      const item = data.find(x => x.id === id)
      if (item) {
        item.dislike += 1
        saveData(data)
        render()
      }
    }

    render()
  </script>
</body>
</html>
